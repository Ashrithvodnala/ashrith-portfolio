{{- if .Values.monitoring.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: incident-copilot
  labels:
    {{- include "copilot.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "copilot.selector" . | nindent 6 }}
  endpoints:
    - { port: http, path: /metrics/, interval: 15s }
{{- end }}
