# Intentionally broken workloads that trigger alerts for the agent to investigate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ashrithvodnala/ashrith-portfolio.git
    targetRevision: main
    path: incident-copilot-aws/deploy/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
