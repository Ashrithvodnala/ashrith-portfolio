apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incident-copilot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ashrithvodnala/ashrith-portfolio.git
    targetRevision: main
    path: incident-copilot-aws/deploy/helm/incident-copilot
  destination:
    server: https://kubernetes.default.svc
    namespace: copilot
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
