# Free local demo, no cloud and no cluster needed:
# Ollama runs a small open-source model with tool calling; K8S_MODE=fake returns sample cluster data.
# Usage (from incident-copilot-aws/):  docker compose -f local/docker-compose.yml up --build
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull qwen2.5:3b"]

  copilot:
    build: { context: .., dockerfile: app/Dockerfile }
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      LLM_PROVIDER: openai
      OPENAI_BASE_URL: http://ollama:11434/v1
      OPENAI_MODEL: qwen2.5:3b
      K8S_MODE: fake
    ports: ["8000:8000"]

volumes:
  ollama: {}
