[project]
name = "opspilot"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so lint results do not change when ruff updates its defaults.
select = ["E4", "E7", "E9", "F"]
