# Free local stack: pgvector + Ollama (LLM + embeddings) + OpsPilot + Prometheus + Grafana.
# Usage (from repo root):  docker compose -f local/docker-compose.yml up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull llama3.2:3b && ollama pull nomic-embed-text"]

  app:
    build: { context: .., dockerfile: app/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      ollama-pull: { condition: service_completed_successfully }
    environment:
      LLM_PROVIDER: local
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
      CHAT_MODEL: llama3.2:3b
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIM: "768"
      DATABASE_URL: postgresql://opspilot:opspilot@db:5432/opspilot
      ADMIN_TOKEN: local-admin
    ports: ["8000:8000"]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/helm/opspilot/files/dashboard.json:/var/lib/grafana/dashboards/opspilot.json:ro
    ports: ["3000:3000"]

volumes:
  ollama: {}
