apiVersion: v1
kind: Service
metadata:
  name: opspilot
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "opspilot.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
