# Validates Terraform and the Helm chart on every change. Terraform apply is run by hand (see README).
name: opspilot-infra

on:
  pull_request:
    paths: ["opspilot-azure/infra/**", "opspilot-azure/deploy/**"]
  push:
    branches: [main]
    paths: ["opspilot-azure/infra/**", "opspilot-azure/deploy/**"]

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opspilot-azure/infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint opspilot-azure/deploy/helm/opspilot
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          helm template opspilot opspilot-azure/deploy/helm/opspilot \
            | ./kubeconform -strict -ignore-missing-schemas -summary
