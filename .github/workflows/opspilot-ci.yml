# OpsPilot CI/CD: test -> build -> scan -> push to ACR -> bump image tag in Git -> Argo CD deploys.
name: opspilot-ci

on:
  pull_request:
    paths: ["opspilot-azure/app/**", "opspilot-azure/docs/**", ".github/workflows/opspilot-ci.yml"]
  push:
    branches: [main]
    paths: ["opspilot-azure/app/**", "opspilot-azure/docs/**", ".github/workflows/opspilot-ci.yml"]
  workflow_dispatch:

concurrency:
  group: opspilot-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: opspilot-azure

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: opspilot-azure/app/requirements*.txt
      - run: pip install -r app/requirements-dev.txt
      - name: Lint
        run: ruff check app
      - name: Unit tests
        run: pytest -q app/tests
        env:
          PYTHONPATH: app

  build-and-deploy:
    # Only on main, and only when the Azure variables have been set up (see README).
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC login to Azure, no stored secrets
      contents: write   # commit the new image tag
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/opspilot:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image
        run: docker build -f app/Dockerfile -t "$IMAGE" .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push to ACR
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker push "$IMAGE"

      - name: Update Helm image tag (GitOps)
        run: |
          sed -i "s|^  repository: .*|  repository: ${{ vars.ACR_LOGIN_SERVER }}/opspilot|" deploy/helm/opspilot/values.yaml
          sed -i "s|^  tag: .*|  tag: \"${{ github.sha }}\"|" deploy/helm/opspilot/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "opspilot: deploy image ${{ github.sha }}"
          git pull --rebase
          git push
